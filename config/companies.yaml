# Master company list used by get_company_profile.
# fiscal years in corpus: FY2024-25 and FY2025-26. FY ends 31 March for all.
# reporting_units: the unit figures are stated in ("crore" unless noted).
# pdf_prefix: how the report files are named in data/manual-collection/ (e.g. "Infosys-Annual-Report-2024-25.pdf").

defaults:
  fy_end: "03-31"
  reporting_units: crore
  fiscal_years: ["2024-25", "2025-26"]

