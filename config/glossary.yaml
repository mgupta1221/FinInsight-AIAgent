# Metric glossary — the ONLY formulas the calculate tool may use.
# Each metric lists: the inputs it needs (line items from the statement store), the formula,
# the output unit, and which company types it applies to. Formulas are evaluated by a safe
# expression evaluator over the named inputs. Keep this in sync with docs/SPEC.md.

# ---- Non-bank metrics (IT services, FMCG) ----
non_bank:
  operating_margin:
    inputs: [ebit, revenue_from_operations]
    formula: "ebit / revenue_from_operations * 100"
    unit: percent
    note: "EBIT basis, excluding other income. Default operating-margin definition (see SPEC)."
  ebitda_margin:
    inputs: [ebitda, revenue_from_operations]
    formula: "ebitda / revenue_from_operations * 100"
    unit: percent
  net_profit_margin:
    inputs: [net_profit, revenue_from_operations]
    formula: "net_profit / revenue_from_operations * 100"
    unit: percent
  yoy_change:
    inputs: [current, previous]
    formula: "(current - previous) / previous * 100"
    unit: percent
    note: "Also report absolute change = current - previous."
  debt_to_equity:
    inputs: [total_debt, total_equity]
    formula: "total_debt / total_equity"
    unit: ratio
    note: "Non-financial companies only; not meaningful for banks (-> clarify)."
  current_ratio:
    inputs: [current_assets, current_liabilities]
    formula: "current_assets / current_liabilities"
    unit: ratio
  return_on_equity:
    inputs: [net_profit, total_equity]
    formula: "net_profit / total_equity * 100"
    unit: percent
  return_on_capital_employed:
    inputs: [ebit, capital_employed]
    formula: "ebit / capital_employed * 100"
    unit: percent
  earnings_per_share:
    inputs: [net_profit_attributable, weighted_avg_shares]
    formula: "net_profit_attributable / weighted_avg_shares"
    unit: currency_per_share
    note: "Prefer the reported basic EPS; compute only if not reported."

# ---- Bank metrics (Banking Regulation Act 3rd Schedule + RBI) ----
bank:
  gross_npa_ratio:
    inputs: [gross_npa, gross_advances]
    formula: "gross_npa / gross_advances * 100"
    unit: percent
  net_npa_ratio:
    inputs: [net_npa, net_advances]
    formula: "net_npa / net_advances * 100"
    unit: percent
  net_interest_margin:
    inputs: [net_interest_income, average_interest_earning_assets]
    formula: "net_interest_income / average_interest_earning_assets * 100"
    unit: percent
  casa_ratio:
    inputs: [casa_deposits, total_deposits]
    formula: "casa_deposits / total_deposits * 100"
    unit: percent
  cost_to_income:
    inputs: [operating_expenses, net_total_income]
    formula: "operating_expenses / net_total_income * 100"
    unit: percent
  return_on_assets:
    inputs: [net_profit, average_total_assets]
    formula: "net_profit / average_total_assets * 100"
    unit: percent
  crar:
    inputs: [total_capital, risk_weighted_assets]
    formula: "total_capital / risk_weighted_assets * 100"
    unit: percent
    note: "Capital adequacy (Basel III). Prefer the reported CRAR; compute only if not reported."


# =====================================================================================================
# ADDED (agent layer, 13 Nov 2026). Nothing above this line was changed.
#
# WHY these three sections exist:
#   The metric formulas above use inputs such as `ebit`, `total_debt` or `net_total_income`. Those are not
#   lines printed in a financial statement, so the agent could not fetch them from the figure store.
#   (1) `line_items`     names every statement line the agent may fetch and the label wording used in reports.
#   (2) `derived_inputs` says how to build an abstract input from statement lines, so the formulas above
#                        can be used unchanged (e.g. ebit = profit_before_tax + finance_costs - other_income).
#   (3) `reported`       lists ratios that companies state themselves. The agent looks these up on the page
#                        where the company reports them instead of recalculating them, because the inputs
#                        (e.g. average interest-earning assets) are not in the statements.
# Read by src/finsight/tools/glossary.py (new functions line_items(), derived_inputs(), reported_metrics()).
# =====================================================================================================

# applies: bank | non_bank | (absent = both). labels: lower-case label as printed (list markers ignored).
line_items:
  revenue_from_operations: {statement: pnl, applies: non_bank, labels: ["revenue from operations", "revenues from operations"]}
  other_income:            {statement: pnl, labels: ["other income"]}
  # CHANGED (15 Nov 2026): bank_labels / bank_occurrence added to total_income, total_expenses, total_assets.
  # OLD:
  #   total_income:            {statement: pnl, labels: ["total income"]}
  #   total_expenses:          {statement: pnl, labels: ["total expenses", "total expenditure"]}
  #   total_assets:            {statement: balance_sheet, labels: ["total assets"]}
  # WHY: bank statements (RBI format: SBI, HDFC Bank, Kotak) label these rows just "Total". On the P&L the
  #      1st "Total" is total income and the 2nd is total expenditure (interest + operating expenses +
  #      provisions and contingencies); on the balance sheet the 1st "Total" is total capital and
  #      liabilities, which equals total assets. bank_labels are tried only for banks, and only when the
  #      normal labels are not on the page.
  total_income:            {statement: pnl, labels: ["total income"], bank_labels: ["total"], bank_occurrence: 0}
  total_expenses:          {statement: pnl, labels: ["total expenses", "total expenditure"], bank_labels: ["total"], bank_occurrence: 1}
  employee_benefits_expense: {statement: pnl, applies: non_bank, labels: ["employee benefits expense", "employee benefit expenses", "employee benefit expense", "employee benefits expenses"]}
  depreciation:            {statement: pnl, applies: non_bank, labels: ["depreciation and amortisation expense", "depreciation and amortization expense", "depreciation and amortisation expenses", "depreciation and amortization expenses", "depreciation and amortisation", "depreciation and amortization"]}
  finance_costs:           {statement: pnl, applies: non_bank, labels: ["finance costs", "finance cost"]}
  profit_before_tax:       {statement: pnl, labels: ["profit before tax", "profit before exceptional items and tax", "profit before exceptional item and tax"]}
  tax_expense:             {statement: pnl, labels: ["total tax expense", "tax expense"]}
  net_profit:              {statement: pnl, labels: ["profit for the year", "profit for the period", "net profit for the year", "profit after tax", "net profit"]}
  total_assets:            {statement: balance_sheet, labels: ["total assets"], bank_labels: ["total"], bank_occurrence: 0}
  total_equity:            {statement: balance_sheet, labels: ["total equity"]}
  current_assets:          {statement: balance_sheet, applies: non_bank, labels: ["total current assets"]}
  current_liabilities:     {statement: balance_sheet, applies: non_bank, labels: ["total current liabilities"]}
  cash_and_cash_equivalents: {statement: balance_sheet, applies: non_bank, labels: ["cash and cash equivalents"]}
  non_current_borrowings:  {statement: balance_sheet, applies: non_bank, labels: ["borrowings"], occurrence: 0}
  current_borrowings:      {statement: balance_sheet, applies: non_bank, labels: ["borrowings"], occurrence: 1}
  interest_earned:         {statement: pnl, applies: bank, labels: ["interest earned"]}
  interest_expended:       {statement: pnl, applies: bank, labels: ["interest expended"]}
  operating_expenses:      {statement: pnl, applies: bank, labels: ["operating expenses"]}
  deposits:                {statement: balance_sheet, applies: bank, labels: ["deposits"]}
  advances:                {statement: balance_sheet, applies: bank, labels: ["advances"]}

# Abstract inputs used by the formulas above, built from statement lines with the same safe evaluator.
derived_inputs:
  ebit:                {inputs: [profit_before_tax, finance_costs, other_income], formula: "profit_before_tax + finance_costs - other_income"}
  ebitda:              {inputs: [profit_before_tax, finance_costs, other_income, depreciation], formula: "profit_before_tax + finance_costs - other_income + depreciation"}
  total_debt:          {inputs: [non_current_borrowings, current_borrowings], formula: "non_current_borrowings + current_borrowings"}
  capital_employed:    {inputs: [total_assets, current_liabilities], formula: "total_assets - current_liabilities"}
  net_interest_income: {inputs: [interest_earned, interest_expended], formula: "interest_earned - interest_expended"}
  net_total_income:    {inputs: [interest_earned, interest_expended, other_income], formula: "interest_earned - interest_expended + other_income"}

# Ratios the company states itself: looked up in the report text, never recalculated by the agent.
reported:
  gross_npa_ratio:     {unit: percent, search: "gross NPA ratio gross NPAs to gross advances", keywords: ["gross npa", "gnpa", "gross non-performing"], hint: "gross non-performing assets as a percentage of gross advances"}
  net_npa_ratio:       {unit: percent, search: "net NPA ratio net NPAs to net advances", keywords: ["net npa", "nnpa", "net non-performing"], hint: "net non-performing assets as a percentage of net advances"}
  casa_ratio:          {unit: percent, search: "CASA ratio CASA deposits per cent of total deposits", keywords: ["casa"], hint: "current and savings account (CASA) deposits as a percentage of total deposits; often worded as 'CASA deposits accounted for X per cent of total deposits'"}
  net_interest_margin: {unit: percent, search: "net interest margin NIM", keywords: ["net interest margin", "nim"], hint: "net interest income as a percentage of average interest-earning assets; take the figure the bank states"}
  crar:                {unit: percent, search: "capital adequacy ratio CRAR Basel III total capital", keywords: ["capital adequacy", "crar", "total capital ratio"], hint: "total capital adequacy ratio under Basel III (not Tier 1 or CET1 alone)"}
  return_on_assets:    {unit: percent, search: "return on assets ROA", keywords: ["return on assets", "return on average assets", "roa"], hint: "net profit as a percentage of average total assets, as the bank states it"}
  earnings_per_share:  {unit: currency_per_share, search: "basic earnings per share", keywords: ["earnings per", "eps"], hint: "basic earnings per equity share for the year, in rupees"}
