# Starts the three services together: the chat app, Qdrant (search), Langfuse (tracing).
#
# Usage:
#   1. Copy .env.example to .env and fill in OPENAI_API_KEY.
#   2. Place vm04-ca.crt in the project root.
#   3. Place the 30 annual-report PDFs in data/manual-collection/.
#   4. docker compose --env-file .env up --build --wait app qdrant
#      (CHANGED 22 Nov 2026: "app qdrant" starts only what the project uses. Langfuse is not used by the code;
#       leave the two names out to start it as well.)
#   5. Open http://localhost:8501 for the chat UI.
#
# To run ingestion inside Docker:
#   docker compose exec app python -m ingest.run_ingest

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      # Override localhost URLs — inside Docker, services use their service names.
      - QDRANT_URL=http://qdrant:6333
      - LANGFUSE_HOST=http://langfuse:3000
      # Cert is at /app/vm04-ca.crt (copied by Dockerfile).
      - OPENAI_CA_CERT=/app/vm04-ca.crt
      # ADDED (22 Nov 2026, before the first real Docker run):
      # The conversation database is kept in a Docker volume, not in the shared ./store folder. WHY: SQLite needs
      # file locking, which a folder shared from Windows or macOS does not always give; the app would then fail on
      # the first question. Past conversations made inside Docker therefore stay inside Docker.
      - MEMORY_DB=/app/state/memory.sqlite
      # The embedding model and the reranker are downloaded once and kept in the same volume, not on every start.
      - HF_HOME=/app/state/huggingface
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./store:/app/store
      - ./data:/app/data
      - ./vm04-ca.crt:/app/vm04-ca.crt:ro
      # ADDED (22 Nov 2026): see MEMORY_DB and HF_HOME above; and evaluation results and exported notes written
      # inside the container land in ./results on the laptop, so they are not lost when the container is removed.
      - app-state:/app/state
      - ./results:/app/results
      - ./src:/app/src
      - ./app:/app/app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  # Langfuse needs a Postgres backend. Minimal self-hosted setup for local tracing.
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/postgres
      - NEXTAUTH_SECRET=local-dev-secret
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=local-dev-salt
    depends_on:
      langfuse-db:
        condition: service_started
    restart: unless-stopped

  langfuse-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

volumes:
  app-state:
  qdrant-data:
  langfuse-db-data:
